<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Ultimate Web Redactor</h1>

  <div class="modes" id="modes">
    <button type="button" data-mode="mosaic" data-i18n="modeMosaic">Pixelate</button>
    <button type="button" data-mode="blur" data-i18n="modeBlur">Blur</button>
    <button type="button" data-mode="solid" data-i18n="modeSolid">Black out</button>
    <button type="button" data-mode="frame" data-i18n="modeFrame">Red box</button>
  </div>

  <div class="preview">
    <svg id="defs" aria-hidden="true"></svg>
    <span id="sample" data-i18n="sample">Sample text 0123</span>
  </div>

  <div id="rowMosaic">
    <label class="row"><span data-i18n="labelBlock">Block</span>
      <input type="range" id="mosaicPx" min="3" max="40" step="1">
      <output id="mosaicPxOut"></output></label>
  </div>

  <div id="rowBlur">
    <label class="row"><span data-i18n="labelBlur">Radius</span>
      <input type="range" id="blurPx" min="1" max="40" step="1">
      <output id="blurPxOut"></output></label>
  </div>

  <div id="rowFrame">
    <label class="row"><span data-i18n="labelWidth">Width</span>
      <input type="range" id="frameWidth" min="1" max="12" step="1">
      <output id="frameWidthOut"></output></label>
    <label class="row"><span data-i18n="labelPad">Padding</span>
      <input type="range" id="framePad" min="0" max="24" step="1">
      <output id="framePadOut"></output></label>
    <label class="row"><span data-i18n="labelRadius">Corner</span>
      <input type="range" id="frameRadius" min="0" max="32" step="1">
      <output id="frameRadiusOut"></output></label>
    <div class="row"><span data-i18n="labelColor">Color</span><div class="swatches" id="swatches"></div></div>
  </div>

  <div id="rowSolid" class="hint" data-i18n="solidHint">Nothing to adjust. It just paints over.</div>

  <label class="row check">
    <input type="checkbox" id="lock">
    <span data-i18n="lockLabel">Keep clicks from removing it</span>
  </label>

  <div class="actions">
    <button type="button" id="applyRect" class="primary"><span data-i18n="btnRect">Draw a box</span><kbd data-cmd="rect-mode">Ctrl+Shift+E</kbd></button>
    <button type="button" id="applySelection"><span data-i18n="btnSelection">Apply to selection</span><kbd data-cmd="hide-selection">Ctrl+Shift+Y</kbd></button>
    <button type="button" id="pickElement"><span data-i18n="btnPick">Pick an element</span><kbd data-cmd="pick-element">Ctrl+Shift+L</kbd></button>
    <button type="button" id="revealAll" class="ghost"><span data-i18n="btnReveal">Undo everything</span></button>
  </div>

  <p class="note" data-i18n="note">Click to remove. Only black out is unrecoverable.</p>

  <script src="popup.js"></script>
</body>
</html>
